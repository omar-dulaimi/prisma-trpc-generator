name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.19.0', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run generate
        env:
          DATABASE_URL: 'file:./dev.db'

      # Type-check happens during build (tsc in npm run generate). No separate typecheck script.

      - name: Run linting
        run: pnpm run lint || echo "Linting failed but continuing for now"
        continue-on-error: true

      - name: Run unit tests
        run: pnpm test --silent

    # Skip coverage tests for now due to performance issues
    # - name: Run coverage tests
    #   if: matrix.node-version == '20.x'
    #   run: pnpm run test:coverage:basic
    #   timeout-minutes: 5

    # - name: Upload coverage reports
    #   if: matrix.node-version == '20.x'
    #   uses: codecov/codecov-action@v5
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }}
    #     files: ./coverage/coverage-final.json
    #     fail_ci_if_error: false

  package-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: |
          pnpm run generate
          ./package.sh
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: Test package integrity
        run: |
          cd package
          pnpm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-build
          path: package/
          retention-days: 7
